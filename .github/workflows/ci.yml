name: CI

# Enable Buildkit and let compose use it to speed up image building
env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

on:
  pull_request:
    branches: ['main']
  workflow_call:

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: '.python-version'
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  # With no caching at all, the entire ci process takes 3m to complete!
  pytest-unit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7.0.1

      - name: Set up docker stack
        uses: ./.github/actions/setup-docker-stack

      - name: Run Unit Tests with coverage
        run: |
          docker compose -f docker-compose.local.yml exec django coverage run -m pytest datagovuk/
          docker compose -f docker-compose.local.yml exec django coverage html

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-artifacts
          path: htmlcov

      - name: Fail under 100% coverage
        run: |
          docker compose -f docker-compose.local.yml run django coverage report --fail-under=100

  pytest-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7.0.1

      - name: Set up docker stack
        uses: ./.github/actions/setup-docker-stack

      - name: Run E2E Tests
        run: |
          docker compose -f docker-compose.local.yml exec django pytest -n auto --reruns 1 tests/e2e/

      - name: Upload E2E failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-traces
          path: e2e-failure-traces
