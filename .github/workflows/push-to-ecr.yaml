name: Push to ECR and promote

on:
  workflow_run:
    workflows: ["Build and push multi-arch images"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_sha:
        description: Full git SHA of the image to push/promote (must already be in GHCR)
        required: true
        type: string

env:
  APP_NAME: datagovuk
  AWS_REGION: eu-west-2
  GHCR_IMAGE: ghcr.io/alphagov/datagovuk
  ECS_CLUSTER_INTEGRATION: integration

jobs:
  push_to_integration:
    name: Push to integration ECR
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      id-token: write
      contents: read
    outputs:
      image_sha: ${{ steps.resolve-sha.outputs.image_sha }}
    steps:
      - name: Resolve image SHA
        id: resolve-sha
        run: |
          SHA="${{ github.event.workflow_run.head_sha || inputs.image_sha }}"
          echo "image_sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (integration)
        uses: aws-actions/configure-aws-credentials@v6.2.2
        with:
          role-to-assume: ${{ secrets.INTEGRATION_DEPLOYER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR (integration)
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install crane
        uses: imjasonh/setup-crane@v0.7

      - name: Copy image from GHCR to integration ECR
        run: |
          crane copy \
            ${{ env.GHCR_IMAGE }}:${{ steps.resolve-sha.outputs.image_sha }} \
            ${{ steps.ecr-login.outputs.registry }}/${{ env.APP_NAME }}:${{ steps.resolve-sha.outputs.image_sha }}

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.APP_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query 'taskDefinition' \
            --output json | \
          python3 -c "
import sys, json
td = json.load(sys.stdin)
for k in ['taskDefinitionArn','revision','status','requiresAttributes',
          'compatibilities','registeredAt','registeredBy','deregisteredAt']:
    td.pop(k, None)
print(json.dumps(td))
" > task-definition.json

      - name: Update task definition with new image
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: app
          image: ${{ steps.ecr-login.outputs.registry }}/${{ env.APP_NAME }}:${{ steps.resolve-sha.outputs.image_sha }}

      - name: Deploy to integration ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.APP_NAME }}
          cluster: ${{ env.ECS_CLUSTER_INTEGRATION }}
          wait-for-service-stability: false

  promote_to_staging:
    name: Promote to staging ECR
    needs: push_to_integration
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials (staging)
        uses: aws-actions/configure-aws-credentials@v6.2.2
        with:
          role-to-assume: ${{ secrets.STAGING_DEPLOYER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR (staging)
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install crane
        uses: imjasonh/setup-crane@v0.7

      - name: Copy image from GHCR to staging ECR
        run: |
          crane copy \
            ${{ env.GHCR_IMAGE }}:${{ needs.push_to_integration.outputs.image_sha }} \
            ${{ steps.ecr-login.outputs.registry }}/${{ env.APP_NAME }}:${{ needs.push_to_integration.outputs.image_sha }}

  promote_to_production:
    name: Promote to production ECR
    needs: [push_to_integration, promote_to_staging]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials (production)
        uses: aws-actions/configure-aws-credentials@v6.2.2
        with:
          role-to-assume: ${{ secrets.PRODUCTION_DEPLOYER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR (production)
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install crane
        uses: imjasonh/setup-crane@v0.7

      - name: Copy image from GHCR to production ECR
        run: |
          crane copy \
            ${{ env.GHCR_IMAGE }}:${{ needs.push_to_integration.outputs.image_sha }} \
            ${{ steps.ecr-login.outputs.registry }}/${{ env.APP_NAME }}:${{ needs.push_to_integration.outputs.image_sha }}
