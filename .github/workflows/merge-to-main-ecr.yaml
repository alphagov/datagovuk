name: Merge to main (ECR)

on:
  push:
    branches: ['main']
    paths-ignore: ['docs/**']

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: read

  trivy-scan:
    uses: ./.github/workflows/trivy-scans.yaml
    needs: ci

  push-to-ecr:
    needs:
      - trivy-scan
    uses: ./.github/workflows/push-to-ecr.yml
    with:
      image_sha: ${{ github.sha }}

  notify-slack-if-failure-on-main:
    runs-on: ubuntu-latest
    needs:
      - push-to-ecr
    steps:
      - name: Notify Slack if failure on main
        if: ${{ failure() }}
        uses: alphagov/govuk-infrastructure/.github/actions/report-run-failure@main
        with:
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          channel: datagovuk-technical
