name: Merge to main (ECR)

on:
  push:
    branches: ['main']
    paths-ignore: ['docs/**']

jobs:
  get-main-sha:
    runs-on: ubuntu-latest
    outputs:
      main_sha: ${{ steps.fetch.outputs.sha }}
    steps:
      - name: Get tip of main SHA
        id: fetch
        run: |
          MAIN_SHA=$(git ls-remote ${{ github.server_url }}/${{ github.repository }}.git refs/heads/main | awk '{print $1}')
          echo "sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"

  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: read

  trivy-scan:
    uses: ./.github/workflows/trivy-scans.yaml
    needs: ci

  push-to-ecr:
    needs:
      - trivy-scan
      - get-main-sha
    uses: ./.github/workflows/push-to-ecr.yml
    with:
      image_sha: ${{ needs.get_main_sha.outputs.main_sha }}

  notify-slack-if-failure-on-main:
    runs-on: ubuntu-latest
    needs:
      - push-to-ecr
    steps:
      - name: Notify Slack if failure on main
        if: ${{ failure() }}
        uses: alphagov/govuk-infrastructure/.github/actions/report-run-failure@main
        with:
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          channel: datagovuk-technical
